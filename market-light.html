<!-- خانات الإضافة - انسخ هادو كاملين وحطهم بلاصة الفورم القديم -->
<input id="pn" placeholder="اسم المنتج">
<input id="pp" placeholder="الثمن">
<input id="pi" placeholder="رابط الصورة">
<input id="pa" placeholder="رابط أمازون (خليه خاوي للواتساب)" style="border:2px dashed #ff9900">

<script>
function addProduct(){
  let n = document.getElementById('pn').value;
  let p = document.getElementById('pp').value;
  let i = document.getElementById('pi').value || 'https://via.placeholder.com/400';
  let a = document.getElementById('pa').value; // رابط أمازون

  if(!n || !p){ alert('عمر الاسم والثمن'); return; }

  let list = JSON.parse(localStorage.getItem('dar_products')||'[]');
  list.push({n:n, p:p, i:i, a:a});
  localStorage.setItem('dar_products', JSON.stringify(list));
  location.reload();
}

// كود عرض المنتج - بدلو فدالة render()
function getBtn(o){
  if(o.a && o.a.includes('amazon.')){
    return `<span style="background:#ff9900;padding:3px 7px;border-radius:10px;font-size:11px">AMAZON</span><br><a href="${o.a}" target="_blank" style="background:#ff9900;color:#000;padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:bold;display:inline-block;margin-top:5px">🛒 اشتري من أمازون</a>`;
  }else{
    return `<a href="https://wa.me/212600000000?text=أريد ${o.n}" target="_blank" style="background:#111;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:bold;display:inline-block">💬 واتساب</a>`;
  }
}
</script>
