<script>
// إنشاء روابط أمازون تلقائيا
function getAmazonUrl(p){
  if(!p.amazonLink) return null;
  let url = p.amazonLink;
  if(!url.includes('tag=')){
    url += (url.includes('?') ? '&' : '?') + 'tag=' + CONFIG.amazonTag;
  }
  return url;
}

function render(){
  const container = document.getElementById('products');
  container.innerHTML = PRODUCTS.map(p => {
    const amz = getAmazonUrl(p);
    return `
    <div class="bg-[#1a1a1a] rounded-2xl overflow-hidden border border-white/10 hover:border-gold/50 transition">
      <div class="relative">
        <img src="${p.image}" class="w-full h-56 object-cover">
        ${p.badge ? `<span class="absolute top-3 right-3 gold-gradient text-black text-xs font-bold px-3 py-1 rounded-full">${p.badge}</span>` : ''}
      </div>
      <div class="p-4">
        <h3 class="font-bold text-lg mb-2">${p.name}</h3>
        <div class="flex items-center gap-2 mb-2 text-sm text-gray-400">
          <span class="text-yellow-400"><i class="fas fa-star"></i> ${p.rating}</span>
          <span>(${p.reviews} تقييم)</span>
        </div>
        <p class="text-gray-400 text-sm mb-3 line-clamp-2">${p.description}</p>
        <div class="flex items-center justify-between mb-4">
          <div>
            <span class="text-gold font-black text-xl">$${p.price}</span>
            ${p.oldPrice ? `<span class="text-gray-500 line-through text-sm mr-2">$${p.oldPrice}</span>` : ''}
          </div>
          <span class="text-xs ${p.stock < 10 ? 'text-red-400' : 'text-green-400'}">باقي ${p.stock} فقط</span>
        </div>
        ${amz ? `
          <a href="${amz}" target="_blank" class="block w-full bg-[#FF9900] hover:bg-[#FF8800] text-black font-black py-3 rounded-xl text-center transition">
            <i class="fab fa-amazon"></i> اشتري من أمازون
          </a>
          <p class="text-[10px] text-gray-500 text-center mt-2">تربح عمولة عند كل شراء عبر رابطك</p>
        ` : `
          <button onclick="orderWhatsapp(${p.id})" class="w-full bg-white text-black font-bold py-3 rounded-xl">اطلب عبر واتساب</button>
        `}
      </div>
    </div>
    `;
  }).join('');
  document.getElementById('waLink').href = 'https://wa.me/'+CONFIG.whatsapp;
}

function orderWhatsapp(id){
  const p = PRODUCTS.find(x=>x.id===id);
  const msg = `مرحبا دار ندرا، بغيت نطلب: ${p.name} - $${p.price}`;
  window.open('https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(msg),'_blank');
}

render();
</script>

<div id="lang-bar">
  <button onclick="setLang('ar')" id="b-ar" class="active">العربية</button>
  <button onclick="setLang('en')" id="b-en">EN</button>
  <button onclick="setLang('fr')" id="b-fr">FR</button>
  <button onclick="setLang('es')" id="b-es">ES</button>
</div>

<script>
// ===== إعدادات أمازون =====
if(typeof CONFIG!== 'undefined'){
  CONFIG.amazonTag = CONFIG.amazonTag || "darnadra-21";
}

const LANGS = {
  ar: { buyAmz: "اشتري من أمازون - شحن عالمي", buyWa: "اطلب واتساب", ship: "شحن عالمي من أمازون" },
  en: { buyAmz: "Buy on Amazon - Global Shipping", buyWa: "Order WhatsApp", ship: "Global shipping via Amazon" },
  fr: { buyAmz: "Acheter sur Amazon", buyWa: "Commander WhatsApp", ship: "Livraison mondiale" },
  es: { buyAmz: "Comprar en Amazon", buyWa: "Pedir WhatsApp", ship: "Envío global" }
};

function getAmzLink(product){
  const tag = (typeof CONFIG!== 'undefined' && CONFIG.amazonTag)? CONFIG.amazonTag : "darnadra-21";
  if(product.amazonLink) return product.amazonLink.includes('tag=')? product.amazonLink : product.amazonLink + (product.amazonLink.includes('?')? '&' : '?') + 'tag=' + tag;
  let keyword = product.name || product.title || "book watch";
  // تحويل المنتجات ديالك لأمازون
  if(keyword.includes("بكرة") || keyword.includes("ليد")) keyword = "led strip lights";
  else if(keyword.includes("فانوس")) keyword = "moroccan lantern";
  else if(keyword.includes("مبخرة") || keyword.includes("بخور")) keyword = "electric bakhoor burner";
  else if(keyword.includes("كتاب")) keyword = "rare antique book";
  else if(keyword.includes("ساعة")) keyword = "luxury wooden watch";
  else if(keyword.includes("عباية")) keyword = "abaya dress";
  return "https://www.amazon.com/s?k=" + encodeURIComponent(keyword) + "&tag=" + tag;
}

function setLang(l){
  localStorage.setItem('dar_lang', l);
  document.querySelectorAll('#lang-bar button').forEach(b=>b.classList.remove('active'));
  document.getElementById('b-'+l).classList.add('active');
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar'? 'rtl' : 'ltr';
  updateButtons(l);
}

function updateButtons(lang){
  const t = LANGS[lang] || LANGS['ar'];
  document.querySelectorAll('.product-card, [class*="rounded-2xl"]').forEach(card=>{
    let btn = card.querySelector('.amz-btn');
    if(!btn){
      // قلب على زر الشراء القديم
      let oldBtn = card.querySelector('button, a[href*="wa.me"]');
      if(oldBtn &&!card.querySelector('.amz-btn')){
        // جبد معلومات المنتج
        let titleEl = card.querySelector('h3');
        let name = titleEl? titleEl.innerText : "product";
        let fakeProduct = { name: name };
        let amzUrl = getAmzLink(fakeProduct);
        // زيد زر أمازون فوق زر واتساب
        let amz = document.createElement('a');
        amz.href = amzUrl;
        amz.target = "_blank";
        amz.className = "amz-btn";
        amz.innerHTML = '<i class="fab fa-amazon"></i> ' + t.buyAmz;
        oldBtn.parentNode.insertBefore(amz, oldBtn);
        // زيد ملاحظة الشحن
        let ship = document.createElement('p');
        ship.style = "font-size:9px;color:#d4a574;text-align:center;margin-top:4px;opacity:0.7";
        ship.innerText = t.ship + " - Tag: darnadra-21";
        amz.parentNode.insertBefore(ship, oldBtn);
      }
    } else {
      btn.innerHTML = '<i class="fab fa-amazon"></i> ' + t.buyAmz;
    }
  });
}

// شغل تلقائيا ملي يتحل المتجر
setTimeout(()=>{
  let saved = localStorage.getItem('dar_lang') || 'ar';
  setLang(saved);
  updateButtons(saved);
  // راقب إلا تزادو منتجات جدد
  setInterval(()=>{ let l = localStorage.getItem('dar_lang') || 'ar'; updateButtons(l); }, 2000);
}, 1500);

console.log("✅ DAR NODRA Global Museum - Amazon Connected - Tag: darnadra-21");
</script>
