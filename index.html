<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الأنتيك والملوك | ساعات، ديكور، وتحف نادرة</title>
    <!-- تضمين Tailwind CSS للتصميم المتجاوب -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-amber-50/30 text-gray-800 font-sans">

    <!-- شريط التنقل -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-amber-100">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-serif font-bold text-amber-800">🕰️ متجر العراقة</a>
            
            <!-- أزرار التصنيفات -->
            <div class="hidden md:flex gap-6 font-medium text-gray-600">
                <button onclick="filterCategory('all')" class="hover:text-amber-800 transition">الكل</button>
                <button onclick="filterCategory('watches')" class="hover:text-amber-800 transition">ساعات يدوية</button>
                <button onclick="filterCategory('decor')" class="hover:text-amber-800 transition">ديكور راقٍ</button>
                <button onclick="filterCategory('antiques')" class="hover:text-amber-800 transition">أشياء قديمة ونادرة</button>
            </div>

            <button onclick="toggleCart()" class="bg-amber-800 text-white px-4 py-2 rounded-lg hover:bg-amber-900 transition flex items-center gap-2">
                <span>السلة</span>
                <span id="cart-count" class="bg-white text-amber-800 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </nav>

    <!-- واجهة المتجر (Hero) -->
    <header class="bg-gradient-to-r from-amber-900 to-amber-950 text-white py-20 text-center px-4">
        <h1 class="text-4xl md:text-5xl font-serif font-bold mb-4 text-amber-100">اكتشف عراقة الماضي وفخامة الحاضر</h1>
        <p class="text-lg text-amber-200/80 max-w-2xl mx-auto">مجموعتنا المختارة من الساعات الكلاسيكية، قطع الديكور الفريدة، والتحف القديمة التي تروي قصة تاريخية.</p>
    </header>

    <!-- قسم المنتجات -->
    <main class="container mx-auto px-6 py-12">
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <!-- المنتجات تتولد هنا تلقائياً عبر JavaScript -->
        </div>
    </main>

    <!-- السلة الجانبية -->
    <div id="cart-drawer" class="fixed inset-y-0 left-0 w-80 bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 z-50 p-6 flex flex-col justify-between hidden">
        <div>
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h3 class="text-xl font-bold text-amber-900">سلة المشتريات</h3>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600 text-3xl">&times;</button>
            </div>
            <div id="cart-items" class="space-y-4 max-h-[60vh] overflow-y-auto"></div>
        </div>
        <div class="border-t pt-4">
            <div class="flex justify-between font-bold text-lg mb-4 text-gray-900">
                <span>المجموع:</span>
                <span id="cart-total">0 درهم</span>
            </div>
            <button onclick="checkoutWhatsApp()" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition flex justify-center items-center gap-2 mb-2">
                💬 اطلب عبر الواتساب
            </button>
        </div>
    </div>

    <footer class="bg-stone-900 text-stone-400 py-8 text-center border-t border-stone-800">
        <p>© 2026 متجر العراقة والأنتيك. جميع الحقوق محفوظة.</p>
    </footer>

    <!-- ربط الملفات البرمجية الخارجيّة -->
    <script src="integrations.js"></script>
    <script src="products.js"></script>
    <script src="cart.js"></script>
</body>
</html>
