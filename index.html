<!-- HEADER -->
<header class="p-4 bg-black/50 backdrop-blur sticky top-0 z-50 border-b border-gold/20">

<!-- PRODUCTS -->
<main class="max-w-6xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">

<script>
// إنشاء روابط أمازون تلقائيا
function getAmazonUrl(p){
  if(!p.amazonLink) return null;
  let url = p.amazonLink;
  if(!url.includes('tag=')){
    url += (url.includes('?') ? '&' : '?') + 'tag=' + CONFIG.amazonTag;
  }
  return url;
}

function render(){
  const container = document.getElementById('products');
  container.innerHTML = PRODUCTS.map(p => {
    const amz = getAmazonUrl(p);
    return `
    <div class="bg-[#1a1a1a] rounded-2xl overflow-hidden border border-white/10 hover:border-gold/50 transition">
      <div class="relative">
        <img src="${p.image}" class="w-full h-56 object-cover">
        ${p.badge ? `<span class="absolute top-3 right-3 gold-gradient text-black text-xs font-bold px-3 py-1 rounded-full">${p.badge}</span>` : ''}
      </div>
      <div class="p-4">
        <h3 class="font-bold text-lg mb-2">${p.name}</h3>
        <div class="flex items-center gap-2 mb-2 text-sm text-gray-400">
          <span class="text-yellow-400"><i class="fas fa-star"></i> ${p.rating}</span>
          <span>(${p.reviews} تقييم)</span>
        </div>
        <p class="text-gray-400 text-sm mb-3 line-clamp-2">${p.description}</p>
        <div class="flex items-center justify-between mb-4">
          <div>
            <span class="text-gold font-black text-xl">$${p.price}</span>
            ${p.oldPrice ? `<span class="text-gray-500 line-through text-sm mr-2">$${p.oldPrice}</span>` : ''}
          </div>
          <span class="text-xs ${p.stock < 10 ? 'text-red-400' : 'text-green-400'}">باقي ${p.stock} فقط</span>
        </div>
        ${amz ? `
          <a href="${amz}" target="_blank" class="block w-full bg-[#FF9900] hover:bg-[#FF8800] text-black font-black py-3 rounded-xl text-center transition">
            <i class="fab fa-amazon"></i> اشتري من أمازون
          </a>
          <p class="text-[10px] text-gray-500 text-center mt-2">تربح عمولة عند كل شراء عبر رابطك</p>
        ` : `
          <button onclick="orderWhatsapp(${p.id})" class="w-full bg-white text-black font-bold py-3 rounded-xl">اطلب عبر واتساب</button>
        `}
      </div>
    </div>
    `;
  }).join('');
  document.getElementById('waLink').href = 'https://wa.me/'+CONFIG.whatsapp;
}

function orderWhatsapp(id){
  const p = PRODUCTS.find(x=>x.id===id);
  const msg = `مرحبا دار ندرا، بغيت نطلب: ${p.name} - $${p.price}`;
  window.open('https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(msg),'_blank');
}

render();
</script>
