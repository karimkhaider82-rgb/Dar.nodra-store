<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دار نضرة | DAR NODRA MAZE</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Cairo,sans-serif}
.header{background:#111;padding:15px;text-align:center;border-bottom:2px solid #D4AF37}
.header h1{color:#D4AF37;margin:0;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;padding:15px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;overflow:hidden;text-align:center;padding:10px}
.card img{width:100%;height:140px;object-fit:cover;border-radius:8px}
.card h3{font-size:14px;margin:8px 0;color:#fff;height:36px;overflow:hidden}
.card .price{color:#D4AF37;font-weight:bold;font-size:13px}
.btn{display:block;background:linear-gradient(45deg,#D4AF37,#b8962f);color:#000;padding:8px;margin-top:8px;border-radius:6px;text-decoration:none;font-weight:bold;font-size:13px}
#lock{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;color:#D4AF37;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:999999}
</style>
</head>
<body>
<div id="lock">
<h1>دار نضرة</h1>
<p>المتجر مغلق للصيانة</p>
<input id="pass" type="password" placeholder="كود الدخول" style="padding:12px;border-radius:8px;border:1px solid gold;text-align:center;margin-top:20px">
<button onclick="if(document.getElementById('pass').value==='nodra123'){document.getElementById('lock').style.display='none'}" style="margin-top:10px;padding:10px 20px;background:gold;color:#000;border:none;border-radius:8px;font-weight:bold">دخول</button>
</div>

<div class="header"><h1>دار نضرة - DAR NODRA MAZE</h1><small>0623894810 - منتجات فاخرة</small></div>
<div id="products" class="grid"></div>

<script>
const products=[
{name:"ساعة Casio Vintage A158WA - #1 الأكثر مبيعا",price:"75 درهم ⭐4.3",img:"https://m.media-amazon.com/images/I/51v6yOfG4OL._SL500_.jpg",link:"https://www.amazon.ae/dp/B000GAYQJ0/?tag=darnodra-21"},
{name:"عطر العربية للعود - فخم 90مل",price:"310 درهم ⭐5.0",img:"https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400",link:"https://www.amazon.ae/s?k=oud+perfume&tag=darnodra-21"},
{name:"ساعة LBOYLOVE نسائية - أزرق و ذهبي",price:"105 درهم",img:"https://images.unsplash.com/photo-1548169874-53e85f753f1e?w=400",link:"https://www.amazon.ae/s?k=women+watch&tag=darnodra-21"},
{name:"معطر Areon فانيليا - 50 مل",price:"29 درهم ⭐4.1",img:"https://images.unsplash.com/photo-1543422654-ac1c6ca993ed?w=400",link:"https://www.amazon.ae/s?k=areon&tag=darnodra-21"}
];
document.getElementById('products').innerHTML=products.map(p=>`
<div class="card">
<img src="${p.img}">
<h3>${p.name}</h3>
<div class="price">${p.price}</div>
<a class="btn" href="${p.link}" target="_blank">شاهد على أمازون</a>
</div>`).join('');
</script>
</body>
</html>
